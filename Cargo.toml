[package]
name = "digital-product-factory"
version = "1.0.0"
edition = "2021"
authors = ["SwiftSoftware143"]
description = "Digital Product Factory - Native Rust desktop app for automated digital product creation"

[dependencies]
# Core UI - egui for native speed
egui = "0.24"
egui_extras = { version = "0.24", features = ["image", "datepicker"] }
eframe = { version = "0.24", features = ["default", "persistence"] }

# HTTP client for API calls
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Database
rusqlite = { version = "0.30", features = ["bundled", "chrono"] }

# HTTP client for API calls
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Random for license keys, delays
rand = "0.8"

# Regex for parsing
regex = "1.10"

# File operations
walkdir = "2.4"
zip = "0.6"

# Image handling for product previews
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

# Notifications
notify-rust = { version = "4.10", optional = true }

# Tray icon
tray-icon = { version = "0.11", optional = true }

[features]
default = ["notifications"]
notifications = ["notify-rust"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "dpf"
path = "src/main.rs"
